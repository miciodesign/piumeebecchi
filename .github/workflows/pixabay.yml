name: Foto Pixabay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica le foto
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python3 _src/pixabay_fetch.py
      - name: Ricostruisci il sito
        run: |
          cd _src && python3 build.py && cp -r dist/. ..
      - name: Salva
        run: |
          git config user.name "Piume e Becchi bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Foto da Pixabay" && git push)
